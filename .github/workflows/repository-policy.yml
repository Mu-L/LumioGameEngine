name: LumioGameEngine Development

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      managed: ${{ steps.select.outputs.managed }}
      integration: ${{ steps.select.outputs.integration }}
      native_core: ${{ steps.select.outputs.native_core }}
      voxel: ${{ steps.select.outputs.voxel }}
      runtime: ${{ steps.select.outputs.runtime }}
      server: ${{ steps.select.outputs.server }}
      client: ${{ steps.select.outputs.client }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - id: select
        env:
          LUMIO_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LUMIO_HEAD: ${{ github.sha }}
        run: node eng/verification-policy.mjs plan

  tools:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node eng/test.mjs tools

  managed:
    needs: plan
    if: needs.plan.outputs.managed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: node eng/test.mjs managed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-test-results
          path: .run/managed-test-results/**
          include-hidden-files: true
          if-no-files-found: warn

  integration:
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: LumioGameEngineArchitecture
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioNativeCore
          ref: ${{ needs.plan.outputs.native_core }}
          path: LumioNativeCore
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioVoxelEngine
          ref: ${{ needs.plan.outputs.voxel }}
          path: LumioVoxelEngine
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioGameRuntime
          ref: ${{ needs.plan.outputs.runtime }}
          path: LumioGameRuntime
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioServer
          ref: ${{ needs.plan.outputs.server }}
          path: LumioServer
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioClient
          ref: ${{ needs.plan.outputs.client }}
          path: LumioClient
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Real Native interop and two fresh-process DS/Bot rounds
        working-directory: LumioGameEngineArchitecture
        run: node eng/test.mjs integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence-${{ matrix.os }}
          path: |
            LumioGameEngineArchitecture/.run/verification/**/*.json
            LumioGameEngineArchitecture/.run/verification/**/*.ndjson
            LumioGameEngineArchitecture/.run/verification/**/*.log
            LumioGameEngineArchitecture/.run/verification/**/*.trx
            LumioGameEngineArchitecture/.build/native-workspace-*/build.log
          include-hidden-files: true
          if-no-files-found: warn

  required-gate:
    name: required-gate
    if: always()
    needs: [plan, tools, managed, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Require every selected lane to have actually succeeded
        env:
          LUMIO_PLAN: ${{ needs.plan.outputs.plan }}
          LUMIO_NEEDS: ${{ toJSON(needs) }}
        run: node eng/verification-policy.mjs gate
