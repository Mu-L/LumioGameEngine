name: LumioGameEngine Development

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node eng/test.mjs tools

  managed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: node eng/test.mjs managed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-test-results
          path: .run/managed-test-results/**
          include-hidden-files: true
          if-no-files-found: warn

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: LumioGameEngineArchitecture
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioNativeCore
          path: LumioNativeCore
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioVoxelEngine
          path: LumioVoxelEngine
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioGameRuntime
          path: LumioGameRuntime
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioServer
          path: LumioServer
      - uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioClient
          path: LumioClient
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Real Native interop and two fresh-process DS/Bot rounds
        working-directory: LumioGameEngineArchitecture
        run: node eng/test.mjs integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence-${{ matrix.os }}
          path: |
            LumioGameEngineArchitecture/.run/verification/**/*.json
            LumioGameEngineArchitecture/.run/verification/**/*.ndjson
            LumioGameEngineArchitecture/.run/verification/**/*.log
            LumioGameEngineArchitecture/.run/verification/**/*.trx
            LumioGameEngineArchitecture/.build/native-workspace-*/native/build.log
          include-hidden-files: true
          if-no-files-found: warn
